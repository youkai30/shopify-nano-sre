name: Phase 3 Windows CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  windows-test:
    name: Windows Test Suite & Purchase Blocker Auditor Verification
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install aiohttp pillow

      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium

      - name: Run Pytest Suite on Windows
        env:
          PYTHONPATH: src
          MCP_ENABLED: "false"
          LLM_PROVIDER: "openai"
          LLM_API_KEY: ""
          PYTHONUTF8: "1"
        run: |
          python -m pytest tests/ -v --tb=short --junitxml=windows-pytest-report.xml

      - name: Run Stage 3 CLI Verification on Windows
        shell: powershell
        env:
          PYTHONPATH: src
          MCP_ENABLED: "false"
          LLM_PROVIDER: "openai"
          LLM_API_KEY: ""
          PYTHONUTF8: "1"
        run: |
          python scripts/run_stage3_cli_verification.py | Out-File -Encoding utf8 windows-stage3-cli-log.txt

      - name: Upload Windows CI Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-windows-ci-artifacts
          path: |
            windows-pytest-report.xml
            windows-stage3-cli-log.txt
            reports/
            stage3_verification_output/
