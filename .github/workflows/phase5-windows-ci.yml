name: Phase 5 Windows CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  windows-test:
    name: Windows Test Suite & Cart Consistency Auditor Verification
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install aiohttp pillow

      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium

      - name: Run Pytest Suite on Windows
        env:
          PYTHONPATH: src
          MCP_ENABLED: "false"
          LLM_PROVIDER: "openai"
          LLM_API_KEY: ""
          PYTHONUTF8: "1"
        run: |
          python -m pytest tests/ -v --tb=short --junitxml=windows-phase5-pytest-report.xml

      - name: Clean Previous Phase 5 Output Directories
        shell: powershell
        run: |
          if (Test-Path "verification_output") { Remove-Item -Recurse -Force "verification_output" }
          if (Test-Path "reports") { Remove-Item -Recurse -Force "reports" }

      - name: Run Phase 5 CLI Verification on Windows
        shell: powershell
        env:
          PYTHONPATH: src
          MCP_ENABLED: "false"
          LLM_PROVIDER: "openai"
          LLM_API_KEY: ""
          PYTHONUTF8: "1"
        run: |
          python scripts/run_phase5_cli_verification.py | Out-File -Encoding utf8 windows-phase5-cli-log.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record Commit SHA and Hashes
        shell: powershell
        run: |
          Get-FileHash src/nano_sre/skills/shopify_cart_consistency_auditor.py, src/nano_sre/skills/__init__.py, src/nano_sre/cli.py, tests/test_shopify_cart_consistency_auditor.py, scripts/run_phase5_cli_verification.py | Out-File -Encoding utf8 ci_metadata.txt
          git rev-parse HEAD | Out-File -Encoding utf8 -Append ci_metadata.txt

      - name: Upload Windows CI Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-windows-ci-artifacts
          path: |
            windows-phase5-pytest-report.xml
            windows-phase5-cli-log.txt
            ci_metadata.txt
            reports/
            verification_output/
